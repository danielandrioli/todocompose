plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'dagger.hilt.android.plugin'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.dboy.todocompose'

    compileSdk = 36

    defaultConfig {
        applicationId = "com.dboy.todocompose"
        minSdk = 24
        targetSdk = 36

        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "com.dboy.todocompose.HiltTestRunner"

        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = false

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose = true
    }

    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {

    // -------------------------------------------------------------------------
    // Compose
    // -------------------------------------------------------------------------

    def composeBom = platform('androidx.compose:compose-bom:2026.06.01')

    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.compose.ui:ui-tooling-preview'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'


    // -------------------------------------------------------------------------
    // AndroidX
    // -------------------------------------------------------------------------

    implementation 'androidx.core:core-ktx:1.18.0'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'

    implementation 'androidx.activity:activity-compose:1.13.0'


    // -------------------------------------------------------------------------
    // Room
    // -------------------------------------------------------------------------

    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"


    // -------------------------------------------------------------------------
    // DataStore
    // -------------------------------------------------------------------------

    implementation 'androidx.datastore:datastore-preferences:1.2.1'


    // -------------------------------------------------------------------------
    // Dagger - Hilt
    // -------------------------------------------------------------------------

    implementation "com.google.dagger:hilt-android:$hilt_version"
    ksp "com.google.dagger:hilt-android-compiler:$hilt_version"


    // -------------------------------------------------------------------------
    // Navigation
    // -------------------------------------------------------------------------

    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.hilt:hilt-navigation-compose:1.3.0'


    // -------------------------------------------------------------------------
    // Unit Tests
    // -------------------------------------------------------------------------

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'org.robolectric:robolectric:4.16.1'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'com.google.truth:truth:1.4.5'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'androidx.test:core:1.7.0'


    // -------------------------------------------------------------------------
    // Instrumented Tests
    // -------------------------------------------------------------------------

    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'

    androidTestImplementation 'org.mockito:mockito-android:5.23.0'

    androidTestImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    androidTestImplementation 'com.google.truth:truth:1.4.5'


    // -------------------------------------------------------------------------
    // Hilt Tests
    // -------------------------------------------------------------------------

    androidTestImplementation "com.google.dagger:hilt-android-testing:$hilt_version"
    kspAndroidTest "com.google.dagger:hilt-android-compiler:$hilt_version"
}
